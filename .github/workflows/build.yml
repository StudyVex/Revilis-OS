name: Build Leo OS

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        preset: [perf, balance, quality]
    steps:
      - uses: actions/checkout@v4

      - name: Install live-build
        run: |
          sudo apt update
          sudo apt install -y live-build debootstrap xorriso isolinux syslinux-utils squashfs-tools

      - name: Configure live-build (Preset: ${{ matrix.preset }})
        run: |
          sudo lb clean --purge
          lb config --distribution bookworm \
                    --archive-area main \
                    --debootstrap-options "--variant=minbase" \
                    --bootappend-live "quiet splash"
          mkdir -p config/includes.chroot/etc/
          echo "LEO_PRESET=${{ matrix.preset }}" | sudo tee config/includes.chroot/etc/leo-preset

      - name: Customize system (Preset: ${{ matrix.preset }})
        run: |
          mkdir -p config/hooks/live/

          if [ "${{ matrix.preset }}" = "perf" ]; then
            cat > config/hooks/live/90-zram-perf.chroot << 'EOF'
          #!/bin/sh -e
          apt install -y zram-tools
          RAM_TOTAL=$(grep MemTotal /proc/meminfo | awk '{print $2}')
          ZRAM_SIZE=$((RAM_TOTAL / 2 / 1024))
          if [ $ZRAM_SIZE -gt 8192 ]; then ZRAM_SIZE=8192; fi
          echo "PERCENT=50" > /etc/default/zramswap
          echo "ALGO=zstd" >> /etc/default/zramswap
          echo "SIZE=${ZRAM_SIZE}" >> /etc/default/zramswap
          echo "PRIORITY=100" >> /etc/default/zramswap
          systemctl enable zramswap.service
          echo "vm.swappiness=100" >> /etc/sysctl.conf
          mkdir -p /usr/local/bin
          cat > /usr/local/bin/kill-heavy-processes.sh << 'EOS'
          #!/bin/bash
          ps aux --sort=-%mem | awk 'NR>1 && $4>80 {system("kill -9 " $2)}'
          EOS
          chmod +x /usr/local/bin/kill-heavy-processes.sh
          echo "*/5 * * * * root /usr/local/bin/kill-heavy-processes.sh" >> /etc/crontab
          EOF
            chmod +x config/hooks/live/90-zram-perf.chroot
          fi

          if [ "${{ matrix.preset }}" = "balance" ]; then
            cat > config/hooks/live/90-zram-balance.chroot << 'EOF'
          #!/bin/sh -e
          apt install -y zram-tools tuned
          RAM_TOTAL=$(grep MemTotal /proc/meminfo | awk '{print $2}')
          ZRAM_SIZE=$((RAM_TOTAL / 2 / 1024))
          if [ $ZRAM_SIZE -gt 4096 ]; then ZRAM_SIZE=4096; fi
          echo "PERCENT=50" > /etc/default/zramswap
          echo "ALGO=lz4" >> /etc/default/zramswap
          echo "SIZE=${ZRAM_SIZE}" >> /etc/default/zramswap
          echo "PRIORITY=100" >> /etc/default/zramswap
          systemctl enable zramswap.service
          echo "vm.swappiness=60" >> /etc/sysctl.conf
          tuned-adm profile balanced
          EOF
            chmod +x config/hooks/live/90-zram-balance.chroot
          fi

          if [ "${{ matrix.preset }}" = "quality" ]; then
            cat > config/hooks/live/90-zram-quality.chroot << 'EOF'
          #!/bin/sh -e
          apt install -y zram-tools tuned
          RAM_TOTAL=$(grep MemTotal /proc/meminfo | awk '{print $2}')
          ZRAM_SIZE=$((RAM_TOTAL / 4 / 1024))
          if [ $ZRAM_SIZE -gt 4096 ]; then ZRAM_SIZE=4096; fi
          echo "PERCENT=25" > /etc/default/zramswap
          echo "ALGO=lz4" >> /etc/default/zramswap
          echo "SIZE=${ZRAM_SIZE}" >> /etc/default/zramswap
          echo "PRIORITY=100" >> /etc/default/zramswap
          systemctl enable zramswap.service
          echo "vm.swappiness=30" >> /etc/sysctl.conf
          tuned-adm profile throughput-performance
          EOF
            chmod +x config/hooks/live/90-zram-quality.chroot
          fi

      - name: Build the ISO
        run: sudo lb build 2>&1 | tee build.log

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: LeoOS-${{ matrix.preset }}
          path: |
            live-image-*.iso
            build.log
          if-no-files-found: error
